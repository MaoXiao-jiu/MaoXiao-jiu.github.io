<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册-MaoXiao_jiu</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/register-login.css"> 
    <script src="js/hint.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>
    <div class="page-center">
        <div class="card">
            <div class="navigation-main">
                <div class="left-group">
                    <img src="images/MaoXiao_jiu.png">
                        <p>MaoXiao_jiu</p>
                </div>
                <a class="back-btn" href="index.html">
                    <span style="margin-right: 0.3rem;">&#8617;</span>
                    <span>返回主页</span>
                </a>
            </div>
            <h2 style="text-align: left;">注册</h2>
            <form class="register-form" action="#" method="post">
                <div class="field">
                    <label for="username">填写你的用户名：</label>
                    <input type="text" id="username" name="username" placeholder="用户名">      
                </div>
                <ul class="text-group">
                    <li>你的用户名只能是 2~20 个字母、数字或 _ . @ + -</li>
                </ul>
                 <div class="field">
                    <label for="password">填写你的邮箱:</label>
                    <input type="password" id="password" name="password" placeholder="邮箱">
                </div>
                <ul class="text-group">
                    <li>我们需要一个合法的邮箱</li>
                </ul> 
                <div class="field">
                    <label for="password">填写你的密码：</label>
                    <input type="password" id="password" name="password" placeholder="密码">
                </div>
                <ul class="text-group">
                    <li>你的密码需要包含大写字母、小写字母、特殊符号、数字的任意两种,且不得超过64位</li>
                    <li>请不要使用能被轻易猜到的密码,例如 12345678、abcabc 等</li>
                    <li>请牢记你的密码,如果丢失,你的账号将无法找回</li>
                </ul>
                <div class="field">
                    <label for="password2">再次确认你的密码：</label>
                    <input type="password" id="password2" name="password2" placeholder="确认密码">
                </div>
                <button type="submit" class="submit-btn">注 册</button>
            </form>
            <p style="font-size: 14px;text-align: left;">已有账号?<a href="login.html" class="change-account-a">去登录</a></p>
        </div>
        
    </div>
     <footer class="copyright">
        <img src="images/MaoXiao_jiu.png" alt="MaoXiao_jiu">
        <p class="disclaimer">该背景仅为 Minecraft 的游戏截图,与 Mojang 和 Microsoft 无关联</p>
        <p>网站中的部分内容来自其他平台,真实性需核实,请仔细甄别</p>
        <p class="meta">© 2026 MaoXiao_jiu</p>
    </footer>
</body>
</html>
